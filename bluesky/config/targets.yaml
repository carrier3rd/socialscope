calibration:
  labelers:
    bluesky_mod:
      did: "did:plc:ar7c4by46qjdydhdevvrndac"      # moderation.bsky.app
      host: mod.bsky.app                           # from plc.directory, Nov 19 2026
      # Only these values are written to disk; every other value is counted by month and dropped.
      keep_vals: ["spam", "impersonation", "!takedown"]
    skywatch:
      did: "did:plc:e4elbtctnfqocyfcml6h2lf7"      # skywatch.blue
      host: ozone.skywatch.blue                    # from plc.directory, Nov 19 2026
      # The spec's behavioral whitelist. Skywatch also publishes political and identity values (maga-trump,
      # hammer-sickle, terf-gc and others); those are never written to disk, so faction can't leak into labels.
      # Of the spec's list, Skywatch declared these on Nov 19 2026: suspect-inauthentic, platform-manipulation,
      # follow-farming, bulk-following, amplifier, engagement-abuse, inauthentic-fundraising, spam.
      # repetitive-domain-spam-* is not declared today; the prefix is kept for older labels.
      keep_vals: ["suspect-inauthentic", "platform-manipulation", "follow-farming", "bulk-following",
                  "amplifier", "engagement-abuse", "inauthentic-fundraising", "spam"]
      keep_prefixes: ["repetitive-domain-spam-"]
  # antibot4navalny (did:plc:6vblwh2edno4ayc2mku72r7e) is NOT a labeler: its DID document has no labeler
  # service and its profile says labeler: false. It publishes 7 lists. Whether list membership counts as
  # Tier A (the spec says its "labels" do, and also that community lists are Tier C) is the owner's decision.
  # Nothing reads those lists until then.
  list_sources:
    antibot4navalny: {did: "did:plc:6vblwh2edno4ayc2mku72r7e", tier: undecided}
  extra_known_bad: known_bad/roska_bridge.csv      # under the data folder; hand-entered, never committed

controls:
  self_labeled_bots: true
  verified_accounts: true

limits:
  max_repliers_per_post: 2000
  history_posts_per_account: 1000      # newest 1,000 top-level posts ending at the anchor (the Reddit cap)
  history_replies_per_account: 1000    # and newest 1,000 replies ending at the anchor
  target_accounts_total: 5000
  max_replier_set: 200000              # the recorder stops adding repliers past this and says so in status

collect:
  jetstream_hosts: [jetstream1.us-west.bsky.network, jetstream2.us-east.bsky.network]
  wanted_collections:
    - app.bsky.feed.post
    - app.bsky.feed.like
    - app.bsky.feed.repost
    - app.bsky.graph.follow
    - app.bsky.graph.block
    - app.bsky.graph.listitem
  appview: https://public.api.bsky.app
  plc: https://plc.directory
  constellation: https://constellation.microcosm.blue
  pds_fallback: https://bsky.social
  # Constellation asks for a project name and a contact in the User-Agent. No contact is included until
  # the owner chooses one.
  user_agent: "socialscope-bluesky/0.1 (read-only academic research)"
  # Requests per second, per host. Set low on purpose; the pilot's request log shows whether they can rise.
  rate:
    appview: 4.0
    plc: 1.0
    constellation: 0.5
    pds: 2.0
