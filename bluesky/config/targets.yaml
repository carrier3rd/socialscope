    - {handle: meidastouch.com,            did: "did:plc:xjc7mkotpenvhh6ffewkdpyn"}
    - {handle: atrupar.com,                did: "did:plc:4llrhdclvdlmmynkwsmg5tdc"}
    - {handle: sanders.senate.gov,         did: "did:plc:upw5n2uwhzubjajdtqaufsek"}
    - {handle: warren.senate.gov,          did: "did:plc:ornpixmpy5ts36lh7hmi7wkp"}
    - {handle: schumer.senate.gov,         did: "did:plc:zlgotdjaxzuhw4nefvkxxvxa"}
    - {handle: governor.ca.gov,            did: "did:plc:mojhr33bx3rw4dxxpehd32qz"}
    - {handle: hcrichardson.bsky.social,   did: "did:plc:wpj5z24vsmik5ocqjybwjpso"}
