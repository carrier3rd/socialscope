# Bluesky politics module: targets and limits. Spec: docs/BLUESKY_POLITICS_SPEC.md section 6.
# Every DID below was resolved on Nov 19 2026 through public.api.bsky.app (resolveHandle + getProfiles).
# `appview.py resolve` re-resolves every handle and fails if a DID has changed. All joins use DIDs.
#
# Target accounts are listed here as collection config. Nothing on Bluesky is named in outputs yet
# (the owner, Nov 19 2026): status files, logs and reports carry counts or hashed ids only.

window:
  # the owner, Nov 19 2026: the test window starts the day the recorder passes its 24-hour pilot and runs
  # 3 weeks. The laptop session fills both dates in when the pilot passes. Pilot days are development data.
  # Set Nov 26 2026: the pilot passed Nov 20 but the standing recorder was not started until Nov 26 21:59 UTC
  # (it replayed from Nov 25 ~08 UTC, the oldest Jetstream still held). The window starts on its first full UTC
  # day; end is 21 days later (exclusive): Nov 27 to Dec 17 inclusive. See the dated addendum in
  # docs/bluesky-politics-predictions.md.
  start: 2026-11-27
  end: 2026-12-18
  days: 21

